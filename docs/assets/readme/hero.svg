<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="VibeGuard — testes de seguranca locais para quem cria com IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="210" cy="180" r="230" fill="url(#glow)"/>

  <!-- Shield -->
  <g transform="translate(120 90)">
    <path d="M90 0 L180 32 V96 C180 150 141 186 90 204 C39 186 0 150 0 96 V32 Z" fill="url(#teal)"/>
    <path d="M90 18 L160 43 V96 C160 139 129 169 90 184 C51 169 20 139 20 96 V43 Z" fill="#0a0a0a" opacity="0.85"/>
    <path d="M58 98 l22 22 l44 -52" fill="none" stroke="url(#teal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <text x="360" y="150" fill="#f4f4f5" font-size="76" font-weight="700" letter-spacing="-2">VibeGuard</text>
    <text x="362" y="196" fill="#a1a1aa" font-size="27" font-weight="400">Testes de seguranca para quem cria software com IA.</text>

    <g transform="translate(362 238)" font-size="22" fill="#e4e4e7" font-weight="600">
      <g>
        <rect x="0" y="0" width="190" height="44" rx="10" fill="#141416" stroke="#27272a"/>
        <text x="20" y="29">🔑 Segredos</text>
      </g>
      <g transform="translate(206 0)">
        <rect x="0" y="0" width="170" height="44" rx="10" fill="#141416" stroke="#27272a"/>
        <text x="20" y="29">📖 Codigo</text>
      </g>
      <g transform="translate(392 0)">
        <rect x="0" y="0" width="210" height="44" rx="10" fill="#141416" stroke="#27272a"/>
        <text x="20" y="29">🚨 App ligado</text>
      </g>
    </g>

    <text x="362" y="316" fill="#2dd4bf" font-size="18" font-weight="600" letter-spacing="1">RODA NA SUA MAQUINA · NADA SAI DO SEU COMPUTADOR</text>
  </g>
</svg>
